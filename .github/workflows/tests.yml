name: Lightweight Python checks
on:
  push:
    branches: [main, fix/release-readiness-2026-11]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m compileall -q core ablation metrics integrations experiments tests
      - run: python -m pytest -q tests/
      - name: Smoke-test public benchmark CLI
        run: python -c "from experiments.classification_benchmark import run_benchmark; df = run_benchmark(\'iris\', [\'lr\', \'rf\']); assert len(df) == 2, \'Both baseline models must produce results\'"
